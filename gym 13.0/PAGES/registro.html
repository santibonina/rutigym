    <!-- ICONO DE USUARIO -->
    <div class="usuario" role="button" tabindex="0" aria-label="Menú de usuario" aria-expanded="false" aria-haspopup="true" aria-controls="menu">
        <svg class="user-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>
    </div>

        </div>

    <hr>

    <!-- Formulario de registro de cuenta. -->
    <h2 style="text-align:center">Registrarse</h2>
    <form class="centrado" id="registro-form">
        <label for="nombre">Nombre de usuario:</label>
        <input type="text" id="nombre" name="nombre" autocomplete="username" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" autocomplete="email" required>

        <label for="clave">Contraseña (mínimo 8 caracteres):</label>
        <input type="password" id="clave" name="clave" autocomplete="new-password" minlength="8" required>

        <button type="submit">Crear Cuenta</button>
        <p class="auth-message" id="auth-message" role="status" aria-live="polite"></p>
    </form>

    <p style="text-align:center; margin-top:20px;">¿Ya tenés cuenta? <a href="iniciosesion.html" style="color: red;">Iniciá sesión acá</a></p>
